name: 檢查

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # index.html 由 src/ 產生，這一步確認有人改了 src/ 之後有重新建置
      - run: node tools/build.mjs --check
      - run: node tools/check.mjs
