  <h1>教練：彙整學生的學習紀錄</h1>
  <p class="lede">學生在首頁或最終評量按「下載學習紀錄」會拿到一個 JSON 檔。把全隊交上來的檔案一次選進來，這頁就會幫你整理成一張表，看誰卡在哪一章。</p>
  <div class="note"><strong>資料不會離開這台電腦</strong>檔案只在瀏覽器裡讀，不會上傳到任何地方。網站沒有後端，所以只能請學生自己匯出、交給你。</div>
  <p><label class="btn ghost" for="coachFiles">選擇學習紀錄檔案（可以一次選多個）</label>
     <input type="file" id="coachFiles" accept=".json,application/json" multiple hidden></p>
